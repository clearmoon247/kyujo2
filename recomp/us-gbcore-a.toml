output_file_path = "../build/rsp/us-gbcore-a.cpp"
output_function_name = "kyujo2_us_gbcore_a"
# The core names return labels with addiu $ra, $zero, label.
extra_indirect_branch_targets = [
    0x116c, 0x1190, 0x1228, 0x1370, 0x1390, 0x1458, 0x14cc, 0x1518,
    0x1564, 0x15ec, 0x160c, 0x1880,
]
